[project]
name = "frappe_ai"
authors = [
    { name = "Mohammed Qutubuddin Zafar", email = "mohammedzafar088@gmail.com" }
]
description = "Multi-agent RAG system with neural-network-based query routing, built as a Frappe app."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.0.1",
    "chromadb>=0.5.5",
    "accelerate>=0.33.0",
    "scikit-learn>=1.4.0",
    "huggingface_hub>=0.24.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
